services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hk97_db
      MYSQL_USER: codeup
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  bot:
    build: .
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hk97_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: codeup
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

#      # Adjust these names to whatever your Java code reads:
#      DISCORD_TOKEN: ${DISCORD_TOKEN}
#      POLITICS_AND_WAR_API_KEY: ${POLITICS_AND_WAR_API_KEY}

volumes:
  mysql_data: